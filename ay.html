<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      height:100vh;
      background: linear-gradient(135deg,#ffdde1,#ee9ca7);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .card{
      text-align:center;
      padding:30px;
      animation: zoomIn 1.5s ease;
    }

    h1{
      font-size:clamp(1.8rem,5vw,3rem);
      color:#d6336c;
      margin-bottom:15px;
    }

    .typing{
      font-size:clamp(1rem,4vw,1.3rem);
      color:#444;
      white-space:nowrap;
      overflow:hidden;
      border-right:2px solid #d6336c;
      width:0;
      animation: typing 4s steps(40,end) forwards,
                 blink .8s infinite;
    }

    /* HATI */
    .heart{
      position:absolute;
      font-size:20px;
      animation: float 6s linear infinite;
    }

    @keyframes typing{
      to{ width:100%; }
    }

    @keyframes blink{
      50%{ border-color:transparent; }
    }

    @keyframes float{
      0%{
        transform:translateY(0) scale(1);
        opacity:0;
      }
      20%{opacity:1;}
      100%{
        transform:translateY(-110vh) scale(1.5);
        opacity:0;
      }
    }

    @keyframes zoomIn{
      from{transform:scale(.7);opacity:0;}
      to{transform:scale(1);opacity:1;}
    }

    .tap{
      position:fixed;
      bottom:20px;
      font-size:.9rem;
      color:#fff;
      opacity:.8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hai velyku 🤍</h1>
    <div class="typing">Terima kasih sudah membuat hidupku lebih indah</div>
  </div>

  <div class="tap">Tap layar 💕</div>

  <script>
    // hati melayang
    function createHeart(){
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.bottom = "-20px";
      heart.style.animationDuration = (4 + Math.random() * 3) + "s";
      document.body.appendChild(heart);

      setTimeout(()=>heart.remove(),7000);
    }
    setInterval(createHeart,500);

    // tap layar
    document.body.addEventListener("click",()=>{
      const love = document.createElement("div");
      love.innerHTML = "I Love You 💖";
      love.style.position="fixed";
      love.style.left="50%";
      love.style.top="50%";
      love.style.transform="translate(-50%,-50%)";
      love.style.fontSize="1.5rem";
      love.style.color="#fff";
      love.style.animation="zoomIn 1s ease";
      document.body.appendChild(love);

      setTimeout(()=>love.remove(),1200);
    });
  </script>

</body>
</html>
